name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Read version and verify release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Select-Xml -Path src/DXMirror.App/DXMirror.App.csproj -XPath '/Project/PropertyGroup/Version').Node.InnerText
          if ($version -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Expected a numeric X.Y.Z version, got $version"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'release' -and $env:RELEASE_TAG -cne "v$version") {
            throw "Release tag $env:RELEASE_TAG must match v$version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Audit NuGet dependencies
        run: dotnet restore DXMirror.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low '-warnaserror:NU1900;NU1902;NU1903;NU1904;NU1905'
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: UCRT64
          update: true
          cache: false
      - name: Build and verify the receiver
        shell: msys2 {0}
        run: bash build/build-uxplay.sh
      - name: Test, publish and package the installer
        run: ./build/build.ps1 -SkipReceiver
      - name: Stage installer, checksums, sources and native SBOM
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python build/native-security.py sbom artifacts/receiver
          if ($LASTEXITCODE -ne 0) { throw 'Native SBOM generation failed' }

          $stage = New-Item -ItemType Directory -Path artifacts/release
          $name = "DXMirror-Setup-$env:VERSION-x64.exe"
          $installer = Copy-Item "artifacts/installer/$name" $stage.FullName -PassThru
          if ($installer.Length -eq 0) { throw 'Installer is empty' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content (Join-Path $stage.FullName SHA256.txt) -Encoding ascii
          Copy-Item LICENSE (Join-Path $stage.FullName LICENSE.txt)
          Copy-Item tools/release/LIESMICH.txt $stage.FullName
          Copy-Item artifacts/receiver/licenses/DXMirror-native.cdx.json $stage.FullName
          git archive --format=zip --prefix="DXMirror-$env:VERSION/" --output="artifacts/release/DXMirror-$env:VERSION-source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'DXMirror source archive failed' }
          $uxplayCommit = (Get-Content artifacts/receiver/licenses/native-inventory.tsv -TotalCount 1).Split([char]9)[2]
          $uxplaySource = Join-Path $stage.FullName "UxPlay-$uxplayCommit-source.zip"
          git -C build/work/UxPlay archive --format=zip --prefix="UxPlay-$uxplayCommit/" --output="$uxplaySource" $uxplayCommit
          if ($LASTEXITCODE -ne 0) { throw 'UxPlay source archive failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14

  scan:
    name: Scan Windows receiver
    needs: build
    uses: ./.github/workflows/native-scan.yml
    with:
      published: false

  scan-published:
    name: Rescan latest published receiver
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/native-scan.yml
    with:
      published: true

  upload:
    name: Attach installer to GitHub release
    if: github.event_name == 'release'
    needs: [build, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-assets-${{ github.event.release.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: release-assets
      - name: Upload missing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
        shell: bash
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          jq -e --arg id "$RELEASE_ID" '(.id | tostring) == $id and .draft == false' \
            <<< "$release" > /dev/null
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          [[ "$commit" == "$GITHUB_SHA" ]] || { echo "::error::The release tag moved"; exit 1; }
          missing=()
          for asset in release-assets/*; do
            name=$(basename "$asset")
            existing=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // "unknown"' <<< "$release")
            if [[ -z "$existing" ]]; then
              missing+=("$asset")
            else
              hash=$(sha256sum "$asset")
              [[ "$existing" == "sha256:${hash%% *}" ]] || {
                echo "::error::Release already has a different asset named $name"; exit 1;
              }
            fi
          done
          if (( ${#missing[@]} )); then
            gh release upload "$RELEASE_TAG" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
          fi
